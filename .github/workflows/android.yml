name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log
      - name: Surface errors as annotations
        if: failure()
        run: |
          msg=$(grep -E "^e: |What went wrong|Could not |Caused by|error:" -A3 build.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A",$0}')
          echo "::error title=build-errors::${msg}"
      - uses: actions/upload-artifact@v4
        with:
          name: OSSimulator-debug
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
